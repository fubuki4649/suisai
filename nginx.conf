server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/suisai;
    index index.html;

    # SPA routing: fallback all non-file requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite static assets (contain content hashes, safe to cache long-term)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
