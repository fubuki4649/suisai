<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Fluid Gradient -->
    <linearGradient id="gradient1" x1="60" y1="80" x2="380" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#0088FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Watercolor Pigment Gradient -->
    <linearGradient id="gradient2" x1="150" y1="160" x2="390" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="40%" stop-color="#EC4899"/>
      <stop offset="75%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Subtle Single Specular Catchlight for Glass Depth -->
    <linearGradient id="subtleTopLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- === Back Card: 3:2 Landscape Photo Print ("Sui" / Water) === -->
  <g transform="rotate(-6 220 190)">
    <rect
      x="60"
      y="80"
      width="320"
      height="220"
      rx="40"
      fill="url(#gradient1)"
      fill-opacity="0.92"
    />
    <!-- Minimalist Single Top Edge Catchlight -->
    <path
      d="M 96 82 L 344 82"
      stroke="url(#subtleTopLight)"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>

  <!-- === Front Card: 2:3 Portrait Photo Print ("Sai" / Watercolor) === -->
  <g transform="rotate(6 270 320)">
    <rect
      x="150"
      y="160"
      width="240"
      height="320"
      rx="40"
      fill="url(#gradient2)"
      fill-opacity="0.88"
      style="mix-blend-mode: screen;"
    />
    <!-- Minimalist Single Top Edge Catchlight -->
    <path
      d="M 186 162 L 354 162"
      stroke="url(#subtleTopLight)"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>
